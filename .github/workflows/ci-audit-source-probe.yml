# ★Two questions, one run, cheapest first. Read-only, dispatch-only, deleted once answered.
#
# ★WHY. CI fails ~27% of the time on every branch (7/26 runs, 2026-09-01→09-04), and all seven
# failures were the same step: `Validate` → `Security audit (production deps)`. It is not a red main
# and not one stuck PR — it is a tax on every PR in the repo.
#
# ★The first candidate fix (read Dependabot alerts instead of the npm registry) is BLOCKED, measured:
# run 33829111599 → `403 Resource not accessible by integration`, with job-level
# `permissions: security-events: read` already granted. So it is the principal, not the scope, and
# the remedy would be a PAT — a secret, which is a decision this peer does not get to make.
#
# ★Before spending that, two cheaper questions. Order matters and it is not the obvious order:
#
#   (b') ★Does a plain `npm audit` work from CI *today*?
#        → If yes, ★THE DATA SOURCE DOES NOT CHANGE, so the detection-set comparison that qualified
#          the Dependabot swap (7 packages vs 7, zero difference either way) does NOT have to be
#          redone. Nothing to re-verify.
#
#   (b)  ★Can GITHUB_TOKEN read the public GitHub Advisory Database (GraphQL)?
#        → Even if yes, that database answers "which versions of package X are vulnerable", not
#          "is THIS repo vulnerable" — so it needs matching logic written here. ★That makes the
#          verification burden worse than the first attempt, not better: last time the comparison was
#          between two vendors' products; this time it would be checking our own implementation.
#          (conductor's framing, and it is the right one — the cost is correctness, not code.)
#
# ★(b') IS EXPECTED TO FAIL, and is worth running anyway. The author of audit-prod-deps.ts wrote
# (2026-07-26): "no override or npm upgrade could fix [it] because no advisory was involved". Three
# reasons to re-measure rather than inherit that:
#   - ★It is six weeks old, and this is a registry mid-retirement — the failure modes have already
#     moved once in front of us (503 on 09-03, 400 on 09-04).
#   - ★The v11 failure was an undecoded-gzip client error, which is npm/node-version dependent.
#   - ★MOST IMPORTANTLY: the same command SUCCEEDS locally on npm 10.9.2. So the endpoint is not
#     universally dead — it fails *from CI*. That points at the runner's network path or registry-side
#     throttling of Actions IPs, which is not something an npm version argument settles either way.
#     ★This probe therefore measures "does it work from CI now", NOT "does a newer npm fix it".
#   ★(CI runs Node 20 — `NODE_VERSION: '20'`, test.yml:63.)
#
# ★Neither step may fail the job: both answers are results. The only non-zero exit is a positive
# control failing, which means the measurement did not happen and is not an answer at all.
name: CI audit source probe (read-only, two questions)

on:
  workflow_dispatch:

jobs:
  probe:
    name: Can CI audit at all, and can it read the Advisory DB?
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ★Job-level, listing every scope needed — a `permissions:` block REPLACES the default set rather
    # than adding to it (this repo learned that on `Notify main red`, run 30431382682).
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install (no audit — that is the thing under test)
        run: npm ci --prefer-offline --no-audit

      - name: "(b') Does a plain npm audit work from CI today?"
        run: |
          set -uo pipefail
          echo "node=$(node --version)  npm=$(npm --version)"
          echo "★local reference (2026-09-04): npm 10.9.2 → this same command SUCCEEDS"
          echo

          out="${RUNNER_TEMP}/audit.json"; err="${RUNNER_TEMP}/audit.err"
          npm audit --omit=dev --json >"$out" 2>"$err" && rc=0 || rc=$?
          echo "exit=$rc  (★0 = clean, ★1 = vulnerabilities FOUND — both mean the audit RAN)"

          # ★The verdict is not the exit code: `npm audit` exits 1 both when it finds vulnerabilities
          # and when it could not reach the registry. The discriminator is whether the output is a
          # real report — that is the whole reason audit-prod-deps.ts exists.
          if node -e "const d=require('$out'); if(!d.metadata||!d.metadata.vulnerabilities) process.exit(1)" 2>/dev/null; then
            echo "✓ ★(b') PASS — the audit actually ran. metadata.vulnerabilities:"
            node -e "console.log(JSON.stringify(require('$out').metadata.vulnerabilities))"
            echo "  → ★データ源は変わらない ∴ ★条件1（検出集合の比較）の再実施は不要。"
            echo "  → ★#961 は bypass/endpoint の問題であって、指標の差し替えは要らない可能性がある。"
          else
            echo "✗ ★(b') FAIL — no usable report came back. ★これは「脆弱性ゼロ」ではない。"
            echo "--- stderr ---"; head -c 800 "$err"
            echo "--- stdout head ---"; head -c 400 "$out"
          fi

      - name: "(b) Can GITHUB_TOKEN read the public Advisory Database?"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          # ★Positive control first: if GraphQL itself is unreachable, a failure below would be
          # indistinguishable from "this token cannot read advisories" — the exact collapse that made
          # the previous probe's first run unreadable (403 vs success-with-warning, run 33827844263).
          ctl=$(gh api graphql -f query='{viewer{login}}' --jq '.data.viewer.login' 2>&1) && ctl_rc=0 || ctl_rc=$?
          if [ "$ctl_rc" -ne 0 ]; then
            echo "✗ POSITIVE CONTROL FAILED — GraphQL 自体が引けない。★下の結果は無効。"
            echo "$ctl"
            exit 1
          fi
          echo "✓ positive control: GraphQL reachable as '$ctl'"
          echo

          # ★Keep stderr out of the parser. Piping `2>&1` into jq is what made the previous probe
          # unable to answer its own question — a real 403 and a success carrying a warning both
          # arrived as a parse error and both landed in the same branch.
          err="${RUNNER_TEMP}/adv.err"
          raw=$(gh api graphql -f query='{
            securityVulnerabilities(first: 3, ecosystem: NPM, package: "undici") {
              nodes { advisory { ghsaId severity } vulnerableVersionRange }
            }
          }' 2>"$err") && rc=0 || rc=$?

          if [ "$rc" -eq 0 ] && printf '%s' "$raw" | jq -e '.data.securityVulnerabilities.nodes | length' >/dev/null 2>&1; then
            n=$(printf '%s' "$raw" | jq '.data.securityVulnerabilities.nodes | length')
            echo "✓ ★(b) PASS — GITHUB_TOKEN reads the Advisory Database ($n nodes for 'undici')."
            printf '%s' "$raw" | jq -c '.data.securityVulnerabilities.nodes[]'
            echo "  → ★ただし これは『undici のどの版が脆弱か』であって『この repo が脆弱か』ではない。"
            echo "  → ★lockfile との突合を★自前で書く必要があり、★その実装の検証は"
            echo "     ★前回（2ベンダー製品の比較）より★難しい。★採否は別判断。"
          else
            echo "✗ ★(b) FAIL — GITHUB_TOKEN では Advisory Database を読めない。"
            echo "--- stderr ---"; head -c 600 "$err"
          fi

          # ★Both answers are results; only the positive control above may fail this job.
          # ★NOTE: rc here collapses PASS and FAIL into 0 on purpose. If anything ever branches on
          # this job's exit code, split them first.
          exit 0
