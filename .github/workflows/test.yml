# CI Pipeline for MUED LMS v2
# 3 jobs: validate → test → build
# E2E/a11y/performance は外部サービス（DB等）が必要なため CI では実行しない

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ============================================
  # 1. Validate: typecheck + lint + security
  # ============================================
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci --prefer-offline --no-audit

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Security audit (production deps)
        run: npm audit --omit=dev --audit-level=moderate

  # ============================================
  # 2. Test: unit + component tests
  # ============================================
  test:
    name: Test
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci --prefer-offline --no-audit

      - name: Unit tests
        run: npm run test:unit
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"

      - name: Component tests
        run: npm run test:components
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"

  # ============================================
  # 3. Build: Next.js build verification
  # ============================================
  build:
    name: Build
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci --prefer-offline --no-audit

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://build:build@localhost:5432/build"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_build"
          CLERK_SECRET_KEY: "sk_test_build"
          CLERK_WEBHOOK_SECRET: "whsec_mock"
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: "/sign-in"
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: "/sign-up"
          NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: "/dashboard"
          NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: "/dashboard"
          OPENAI_API_KEY: "sk-mock-openai-key-for-build"
          OPENAI_MODEL: "gpt-4"
          OPENAI_MAX_TOKENS: "2000"
          STRIPE_SECRET_KEY: "sk_test_mock_stripe"
          STRIPE_WEBHOOK_SECRET: "whsec_mock_stripe"
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_mock_stripe"
          NEXT_PUBLIC_STRIPE_PRICE_BASIC: "price_mock_basic"
          NEXT_PUBLIC_STRIPE_PRICE_PREMIUM: "price_mock_premium"
          RESEND_API_KEY: "re_mock_resend"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
