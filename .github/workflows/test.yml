# CI Pipeline for MUED LMS v2
# 3 jobs: validate → test → build
# E2E/a11y/performance は外部サービス（DB等）が必要なため CI では実行しない

name: CI

on:
  # `push:` is intentionally absent (removed 2026-07-29, kimny decision).
  # Every change reaches main through a PR, and the push trigger was scoped to [main, develop]
  # — so it never fired on feature branches. All 235 of its 602 runs in 2026-07 were the
  # post-merge re-run on main, at ~8.4 billable min each (measured per job, all ubuntu-latest)
  # = ~1,965 min/month, which by itself pushed the org past the 3,000 min free tier.
  # Precisely: the squashed main commit is a NEW commit, but its tree equals what the PR run
  # already tested UNLESS another PR landed in between. So this trigger was redundant in the
  # common case and only distinguishable when merges interleave — which is real (see below)
  # but was not worth ~$15/month of duplicate runs.
  #
  # ★What this gives up, stated plainly: a push landing on main WITHOUT going through a PR is
  # never tested. That is currently prevented only by convention plus the local
  # block-main-push hook — the server does NOT enforce it (ruleset 14319569 "main-protection"
  # requires a pull request but carries required_status_checks: 0). So a push from another
  # machine or a bypassed hook reaches main untested.
  # Restore this block if main ever starts receiving pushes that did not come from a PR.
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

concurrency:
  group: ci-${{ github.ref }}
  # With the push trigger gone, every run is a PR ref (refs/pull/N/merge), so this condition is
  # now always true — kept as-is because restoring `push:` should also restore its behaviour.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ============================================
  # 1. Validate: typecheck + lint + security
  # ============================================
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci --prefer-offline --no-audit

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Security audit (production deps)
        # Not a plain `npm audit`: that exits 1 both when vulnerabilities are found AND when the
        # audit API is unreachable, so a registry outage is indistinguishable from a security finding
        # (npm's API failed on both endpoints 2026-07-26 and blocked every PR in this repo).
        # The script BLOCKS on real high/critical exactly as before, and only treats "could not ask"
        # differently — loudly, and with an expiry date after which it becomes a hard failure.
        # ★Restore the one-liner above once the registry is healthy; see the script header.
        run: npx tsx scripts/verify/audit-prod-deps.ts

  # ============================================
  # 2. Test: unit + component tests
  # ============================================
  test:
    name: Test
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci --prefer-offline --no-audit

      - name: Unit tests
        run: npm run test:unit
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"

      - name: Component tests
        run: npm run test:components
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"

  # ============================================
  # 3. Build: Next.js build verification
  # ============================================
  build:
    name: Build
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci --prefer-offline --no-audit

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://build:build@localhost:5432/build"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_build"
          CLERK_SECRET_KEY: "sk_test_build"
          CLERK_WEBHOOK_SECRET: "whsec_mock"
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: "/sign-in"
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: "/sign-up"
          NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: "/dashboard"
          NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: "/dashboard"
          OPENAI_API_KEY: "sk-mock-openai-key-for-build"
          OPENAI_MODEL: "gpt-4"
          OPENAI_MAX_TOKENS: "2000"
          STRIPE_SECRET_KEY: "sk_test_mock_stripe"
          STRIPE_WEBHOOK_SECRET: "whsec_mock_stripe"
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_mock_stripe"
          NEXT_PUBLIC_STRIPE_PRICE_BASIC: "price_mock_basic"
          NEXT_PUBLIC_STRIPE_PRICE_PREMIUM: "price_mock_premium"
          RESEND_API_KEY: "re_mock_resend"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
