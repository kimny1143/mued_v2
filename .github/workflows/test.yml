# CI Pipeline for MUED LMS v2
# 3 jobs: validate → test → build
# E2E/a11y/performance は外部サービス（DB等）が必要なため CI では実行しない

name: CI

on:
  # `push:` is intentionally absent (removed 2026-07-29 to stop duplicate billing).
  # Every change reaches main through a PR, and the push trigger was scoped to [main, develop]
  # — so it never fired on feature branches. All 235 of its 602 runs in 2026-07 were the
  # post-merge re-run on main, at ~8.4 billable min each (measured per job, all ubuntu-latest)
  # = ~1,965 min/month, which by itself pushed the org past the 3,000 min free tier.
  #
  # What it actually re-tested: the squashed main commit is a NEW commit, but its tree equals
  # what the PR run already checked UNLESS another PR landed in between.
  # ★Do not read that as "rare": measured over all 235 merges into main in 2026-07, another PR
  # landed between the PR's CI run and its merge in 38 of them = 16.2%, about 1 in 6 (worst
  # case #530: 8 PRs in between). So this trigger genuinely tested something new roughly once
  # every six merges — and in 2026-07 it found nothing in all 38 of those. That, not
  # "it was a duplicate", is the reason it goes: ~1.2 genuinely-new trees a day is worth
  # covering, but it is worth covering ONCE a day, not 235 times a month. Hence the schedule
  # below — that is what replaces this trigger, and why removing it is not simply dropping
  # coverage.
  #
  # ★What this gives up, stated plainly: a push landing on main WITHOUT going through a PR is
  # never tested. The server does NOT prevent that: ruleset 14319569 "main-protection" requires
  # a pull request but carries required_status_checks: 0, AND has
  #   bypass_actors: [{actor_id: 5, actor_type: RepositoryRole, bypass_mode: "always"}]
  # — a role that is allowed to push to main directly, always. (The API does not name role id 5;
  # do not assume. What is certain: this repo has exactly one collaborator, kimny1143, admin.)
  # So the only thing standing between a direct push and untested main is the local
  # block-main-push hook plus convention.
  # Restore this block if main ever starts receiving pushes that did not come from a PR.

  # Replaces the per-merge run: main is tested once a day instead of once per merge.
  # 21:00 UTC = 06:00 JST, finishing before the working day starts.
  # Scheduled runs always use the default branch (main), so this covers exactly what the push
  # trigger covered — the interleaved trees described above — at ~8.4 billable min × 31 days
  # ≈ 260 min/month against the ~1,974 min/month it replaces.
  # ★If you ever change this cron, first sweep every workflow for job-level conditions that
  # compare the schedule string: a stale one silently skips the whole run, and a skip is not
  # reported as a failure. Detection command: root CLAUDE.md, and the header of
  # plugin-funnel-collector.yml. ★The literal strings to search for are deliberately NOT written
  # here — writing them would make the sweep match this comment and report a false positive
  # (same reason plugin-funnel-collector.yml omits them).
  # Verified 2026-07-29: the only job-level condition in this workflow is on `notify-main-red`
  # below, and it gates on the event name, NOT on the schedule string — so changing this cron
  # cannot silently disable anything here. Anchor the search to line starts to skip prose.
  schedule:
    - cron: '0 21 * * *'

  # A manual button, so a broken scheduled run does not mean waiting until tomorrow.
  workflow_dispatch: {}

  pull_request:
    # `develop` deliberately not listed: the branch does not exist (git ls-remote → absent, and
    # all 235 push-triggered runs in 2026-07 had head_branch=main). Leaving a dead branch name
    # here is how `docs/guides/TESTING_GUIDE.md` came to claim a daily run that never existed.
    # Re-add it here if develop is ever created, or its PRs will run no CI at all.
    branches: [main]

env:
  NODE_VERSION: '20'

concurrency:
  group: ci-${{ github.ref }}
  # THREE entry paths, not two — schedule, workflow_dispatch, pull_request:
  #   schedule                  → ci-refs/heads/main
  #   workflow_dispatch on main → ci-refs/heads/main   ← ★the SAME group as schedule
  #   pull_request              → ci-refs/pull/N/merge
  # So a manual dispatch shares a group with the daily run. That is fine and deliberate:
  # cancel-in-progress is false on main, so the dispatch queues behind a run in flight instead
  # of killing it.
  # ★NOT because the notifier would miss a cancelled run — it would not. `always()` runs even
  # then (docs: "Causes the step to always execute, and returns `true`, even when canceled"), and
  # this repo treats cancelled as red, so an issue WOULD be filed. The reason is that such an
  # issue says only "cancelled": it carries no information about whether main is actually healthy,
  # while the day's real coverage has been thrown away.
  # PR runs stay in their own group and still supersede stale runs on the same PR.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ============================================
  # Docs-only PRs (#1156): each job decides for itself, in its first steps
  # ============================================
  # ★Why (conductor 2026-09-28, after the Actions budget ran out): in 2026-09, 109 of 211 PRs changed
  #   only docs/ or root .md files and still ran all three jobs (~11 min, three `npm ci`).
  # ★Why not `paths-ignore`: Validate/Test/Build are what the merge gate requires
  #   (scripts/verify/pr-merge-gate.ts REQUIRED), and it treats a SKIPPED required check as void —
  #   so a docs-only PR could never merge. Instead the three jobs still RUN, under the same names,
  #   and only their heavy steps are skipped: a job whose steps are all skipped concludes `success`.
  # ★No separate `changes` job any more (conductor 2026-10-01, CI review stage 0): a job is billed at
  #   least one minute however short, and that job ran ~10 s on every run. The same check now runs as
  #   a step inside each of the three jobs (same script, same input → the same answer in all three).
  # ★Fail-CLOSED: heavy steps run unless the output is exactly 'false' — an empty or missing output
  #   runs everything (CCO #1156).
  # ★The rule is by path (scripts/ci/docs-only.mjs, unit-tested), never by branch name.
  # ★schedule / workflow_dispatch are never docs-only: they test main as a whole.

  # ============================================
  # 1. Validate: typecheck + lint + security
  # ============================================
  validate:
    name: Validate
    permissions:
      contents: read
      pull-requests: read
    # ★Self-hosted when the repo variable CI_RUNNER_LINUX is set (colima-mued-v2 — ARC on Colima k3s,
    #   conductor 2026-10-01), else GitHub's ubuntu-latest. No repo secrets here: Build's env is mock values,
    #   and the token is the per-run GITHUB_TOKEN (contents/pull-requests: read). Clear the variable to go back.
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    steps:
      # ★Isolation check, self-hosted only (conductor/CCO 2026-10-01). The runner pod must not reach the Mac,
      #   the LAN gateway, the kubelet or the k8s API. Any of the four answering = isolation broken → fail.
      #   Positive control first: github.com:443 MUST answer, so a broken probe (every connect failing) is
      #   never read as "isolated". The Mac is probed on 7000 (AirPlay receiver, always listening) — not a
      #   port that is only open while some app runs. No `name:` on purpose: the merge gate voids a PR that
      #   moves a `name:` line in this file (scripts/verify/pr-merge-gate.ts ⑤), and this check needs none.
      - if: runner.environment == 'self-hosted'
        run: |
          set -u
          can_reach() { timeout 3 bash -c "exec 3<>/dev/tcp/$1/$2" 2>/dev/null; }
          if ! can_reach github.com 443; then
            echo "::error::isolation check is broken: github.com:443 did not answer either"
            exit 1
          fi
          reached=""
          for target in 192.168.5.2:7000 192.168.5.1:22 192.168.5.1:10250 10.43.0.1:443; do
            if can_reach "${target%:*}" "${target##*:}"; then reached="$reached $target"; fi
          done
          if [ -n "$reached" ]; then
            echo "::error::隔離が崩れている — the runner reached:$reached"
            exit 1
          fi
          echo "isolation ok: github.com:443 answers; none of the 4 private targets do"
      - uses: actions/checkout@v4

      # ★Before the detection: it runs scripts/ci/docs-only.mjs with node, and the self-hosted runner image has
      #   no node of its own (ubuntu-latest does). Unconditional, so docs-only runs pay ~10 s for it.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Detect changes
        id: docs
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "event=$EVENT — full pipeline"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # ★Both sides of a rename: moving lib/x.ts into docs/ deletes code, and only previous_filename
          #   says so (CCO #1156).
          # ★curl + jq, not `gh`: the self-hosted runner image (ghcr.io/actions/actions-runner) has no gh
          #   (measured 2026-10-01); curl and jq are there, and on ubuntu-latest too.
          # ★Every page: the endpoint returns at most 100 files per page (GitHub caps the list at 3,000 =
          #   30 pages). A failed request fails the step (set -e) — never a short list read as "docs only".
          : > "$RUNNER_TEMP/files.txt"
          page=1
          while :; do
            body=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/pulls/$PR/files?per_page=100&page=$page")
            printf '%s' "$body" | jq -r '.[] | .filename, (.previous_filename // empty)' >> "$RUNNER_TEMP/files.txt"
            [ "$(printf '%s' "$body" | jq 'length')" -lt 100 ] && break
            page=$((page + 1))
            if [ "$page" -gt 30 ]; then echo "more than 30 pages of files — refusing to guess" >&2; exit 1; fi
          done
          node scripts/ci/docs-only.mjs < "$RUNNER_TEMP/files.txt" >> "$GITHUB_OUTPUT"

      - name: Docs-only PR — heavy steps skipped
        if: steps.docs.outputs.code == 'false'
        run: echo "Only docs/ or root .md changed (scripts/ci/docs-only.mjs). Validate/Test/Build steps skipped; this job reports success."

      - run: npm ci --prefer-offline --no-audit
        if: steps.docs.outputs.code != 'false'

      - name: TypeScript check
        if: steps.docs.outputs.code != 'false'
        run: npx tsc --noEmit

      # scripts/ is excluded wholesale from tsconfig.json, so the step above never sees it. On
      # 2026-08-28 that hid a crash-on-launch in the funnel collector behind a Record<PluginKey,…>
      # annotation that was never checked (#903). This step covers the 68 of 74 files that pass
      # today; the other 6 are listed BY NAME in tsconfig.scripts.json so the debt stays countable.
      # ★It plants a known type error first and asserts tsc catches it — exit 2 means the check
      # itself could not be trusted, which is NOT the same as "no errors found".
      - name: TypeScript check (scripts/)
        if: steps.docs.outputs.code != 'false'
        run: npx tsx scripts/verify/typecheck-scripts.ts

      # .gitignore hides `.claude/skills/*` behind a short allowlist, so a skill that is neither a
      # symlink nor allowlisted is invisible to git — `git status` says clean while the file exists
      # on one disk. Three mued-authored skills were in that state on 2026-08-29 (#914). This check
      # requires every real skill dir to be tracked here or named in .claude/skills/DISTRIBUTED.txt.
      # ★A new distribution turns this red until the skill is classified. That is intended.
      - name: Skill durability (.claude/skills)
        if: steps.docs.outputs.code != 'false'
        run: npx tsx scripts/verify/skill-durability.ts

      - name: ESLint
        if: steps.docs.outputs.code != 'false'
        run: npm run lint

      - name: Security audit (production deps)
        if: steps.docs.outputs.code != 'false'
        # Not a plain `npm audit`: that exits 1 both when vulnerabilities are found AND when the
        # audit API is unreachable, so a registry outage is indistinguishable from a security finding
        # (npm's API failed on both endpoints 2026-07-26 and blocked every PR in this repo).
        # The script BLOCKS on real high/critical exactly as before, and only treats "could not ask"
        # differently — loudly, and with an expiry date after which it becomes a hard failure.
        # ★Restore the one-liner above once the registry is healthy; see the script header.
        run: npx tsx scripts/verify/audit-prod-deps.ts

  # ============================================
  # 2. Test: unit + component tests
  # ============================================
  test:
    name: Test
    needs: validate
    permissions:
      contents: read
      pull-requests: read
    # ★Self-hosted when the repo variable CI_RUNNER_LINUX is set (colima-mued-v2 — ARC on Colima k3s,
    #   conductor 2026-10-01), else GitHub's ubuntu-latest. No repo secrets here: Build's env is mock values,
    #   and the token is the per-run GITHUB_TOKEN (contents/pull-requests: read). Clear the variable to go back.
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    steps:
      # ★Isolation check, self-hosted only (conductor/CCO 2026-10-01). The runner pod must not reach the Mac,
      #   the LAN gateway, the kubelet or the k8s API. Any of the four answering = isolation broken → fail.
      #   Positive control first: github.com:443 MUST answer, so a broken probe (every connect failing) is
      #   never read as "isolated". The Mac is probed on 7000 (AirPlay receiver, always listening) — not a
      #   port that is only open while some app runs. No `name:` on purpose: the merge gate voids a PR that
      #   moves a `name:` line in this file (scripts/verify/pr-merge-gate.ts ⑤), and this check needs none.
      - if: runner.environment == 'self-hosted'
        run: |
          set -u
          can_reach() { timeout 3 bash -c "exec 3<>/dev/tcp/$1/$2" 2>/dev/null; }
          if ! can_reach github.com 443; then
            echo "::error::isolation check is broken: github.com:443 did not answer either"
            exit 1
          fi
          reached=""
          for target in 192.168.5.2:7000 192.168.5.1:22 192.168.5.1:10250 10.43.0.1:443; do
            if can_reach "${target%:*}" "${target##*:}"; then reached="$reached $target"; fi
          done
          if [ -n "$reached" ]; then
            echo "::error::隔離が崩れている — the runner reached:$reached"
            exit 1
          fi
          echo "isolation ok: github.com:443 answers; none of the 4 private targets do"
      # ★fetch-depth: 0 —— plugin-download-retention.test.ts が母集団を git 履歴から導く
      #   （`*_DOWNLOAD_URL` が過去に持った全ての値）。★既定の shallow (depth=1) では
      #   その履歴が存在しないので、★配布物が全件そろっていても必ず RED になる。
      # ★この job だけ。validate / build は履歴を読まないので shallow のまま。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ★Before the detection: it runs scripts/ci/docs-only.mjs with node, and the self-hosted runner image has
      #   no node of its own (ubuntu-latest does). Unconditional, so docs-only runs pay ~10 s for it.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Detect changes
        id: docs
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "event=$EVENT — full pipeline"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # ★Both sides of a rename: moving lib/x.ts into docs/ deletes code, and only previous_filename
          #   says so (CCO #1156).
          # ★curl + jq, not `gh`: the self-hosted runner image (ghcr.io/actions/actions-runner) has no gh
          #   (measured 2026-10-01); curl and jq are there, and on ubuntu-latest too.
          # ★Every page: the endpoint returns at most 100 files per page (GitHub caps the list at 3,000 =
          #   30 pages). A failed request fails the step (set -e) — never a short list read as "docs only".
          : > "$RUNNER_TEMP/files.txt"
          page=1
          while :; do
            body=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/pulls/$PR/files?per_page=100&page=$page")
            printf '%s' "$body" | jq -r '.[] | .filename, (.previous_filename // empty)' >> "$RUNNER_TEMP/files.txt"
            [ "$(printf '%s' "$body" | jq 'length')" -lt 100 ] && break
            page=$((page + 1))
            if [ "$page" -gt 30 ]; then echo "more than 30 pages of files — refusing to guess" >&2; exit 1; fi
          done
          node scripts/ci/docs-only.mjs < "$RUNNER_TEMP/files.txt" >> "$GITHUB_OUTPUT"

      - name: Docs-only PR — heavy steps skipped
        if: steps.docs.outputs.code == 'false'
        run: echo "Only docs/ or root .md changed (scripts/ci/docs-only.mjs). Validate/Test/Build steps skipped; this job reports success."

      - run: npm ci --prefer-offline --no-audit
        if: steps.docs.outputs.code != 'false'

      - name: Unit tests
        if: steps.docs.outputs.code != 'false'
        run: npm run test:unit
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"

      # ★components/**/*.test.tsx run inside "Unit tests" (vitest.config.unit.ts include: jsdom, no Docker).
      #   The separate step ran them under vitest.config.ts — the testcontainers config — for 6 files of
      #   pure UI tests: ~26 s that pushed this job over 3 billed minutes (conductor 2026-10-01).

  # ============================================
  # 3. Build: Next.js build verification
  # ============================================
  build:
    name: Build
    needs: validate
    permissions:
      contents: read
      pull-requests: read
    # ★Self-hosted when the repo variable CI_RUNNER_LINUX is set (colima-mued-v2 — ARC on Colima k3s,
    #   conductor 2026-10-01), else GitHub's ubuntu-latest. No repo secrets here: Build's env is mock values,
    #   and the token is the per-run GITHUB_TOKEN (contents/pull-requests: read). Clear the variable to go back.
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    steps:
      # ★Isolation check, self-hosted only (conductor/CCO 2026-10-01). The runner pod must not reach the Mac,
      #   the LAN gateway, the kubelet or the k8s API. Any of the four answering = isolation broken → fail.
      #   Positive control first: github.com:443 MUST answer, so a broken probe (every connect failing) is
      #   never read as "isolated". The Mac is probed on 7000 (AirPlay receiver, always listening) — not a
      #   port that is only open while some app runs. No `name:` on purpose: the merge gate voids a PR that
      #   moves a `name:` line in this file (scripts/verify/pr-merge-gate.ts ⑤), and this check needs none.
      - if: runner.environment == 'self-hosted'
        run: |
          set -u
          can_reach() { timeout 3 bash -c "exec 3<>/dev/tcp/$1/$2" 2>/dev/null; }
          if ! can_reach github.com 443; then
            echo "::error::isolation check is broken: github.com:443 did not answer either"
            exit 1
          fi
          reached=""
          for target in 192.168.5.2:7000 192.168.5.1:22 192.168.5.1:10250 10.43.0.1:443; do
            if can_reach "${target%:*}" "${target##*:}"; then reached="$reached $target"; fi
          done
          if [ -n "$reached" ]; then
            echo "::error::隔離が崩れている — the runner reached:$reached"
            exit 1
          fi
          echo "isolation ok: github.com:443 answers; none of the 4 private targets do"
      - uses: actions/checkout@v4

      # ★Before the detection: it runs scripts/ci/docs-only.mjs with node, and the self-hosted runner image has
      #   no node of its own (ubuntu-latest does). Unconditional, so docs-only runs pay ~10 s for it.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Detect changes
        id: docs
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "event=$EVENT — full pipeline"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # ★Both sides of a rename: moving lib/x.ts into docs/ deletes code, and only previous_filename
          #   says so (CCO #1156).
          # ★curl + jq, not `gh`: the self-hosted runner image (ghcr.io/actions/actions-runner) has no gh
          #   (measured 2026-10-01); curl and jq are there, and on ubuntu-latest too.
          # ★Every page: the endpoint returns at most 100 files per page (GitHub caps the list at 3,000 =
          #   30 pages). A failed request fails the step (set -e) — never a short list read as "docs only".
          : > "$RUNNER_TEMP/files.txt"
          page=1
          while :; do
            body=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/pulls/$PR/files?per_page=100&page=$page")
            printf '%s' "$body" | jq -r '.[] | .filename, (.previous_filename // empty)' >> "$RUNNER_TEMP/files.txt"
            [ "$(printf '%s' "$body" | jq 'length')" -lt 100 ] && break
            page=$((page + 1))
            if [ "$page" -gt 30 ]; then echo "more than 30 pages of files — refusing to guess" >&2; exit 1; fi
          done
          node scripts/ci/docs-only.mjs < "$RUNNER_TEMP/files.txt" >> "$GITHUB_OUTPUT"

      - name: Docs-only PR — heavy steps skipped
        if: steps.docs.outputs.code == 'false'
        run: echo "Only docs/ or root .md changed (scripts/ci/docs-only.mjs). Validate/Test/Build steps skipped; this job reports success."

      - run: npm ci --prefer-offline --no-audit
        if: steps.docs.outputs.code != 'false'

      - name: Build
        if: steps.docs.outputs.code != 'false'
        run: npm run build
        env:
          DATABASE_URL: "postgresql://build:build@localhost:5432/build"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_build"
          CLERK_SECRET_KEY: "sk_test_build"
          CLERK_WEBHOOK_SECRET: "whsec_mock"
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: "/sign-in"
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: "/sign-up"
          NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: "/dashboard"
          NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: "/dashboard"
          OPENAI_API_KEY: "sk-mock-openai-key-for-build"
          OPENAI_MODEL: "gpt-4"
          OPENAI_MAX_TOKENS: "2000"
          STRIPE_SECRET_KEY: "sk_test_mock_stripe"
          STRIPE_WEBHOOK_SECRET: "whsec_mock_stripe"
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_mock_stripe"
          NEXT_PUBLIC_STRIPE_PRICE_BASIC: "price_mock_basic"
          NEXT_PUBLIC_STRIPE_PRICE_PREMIUM: "price_mock_premium"
          RESEND_API_KEY: "re_mock_resend"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"

  # ============================================
  # 4. Notify: convert a red scheduled run into a GitHub issue
  # ============================================
  # ★Why: main no longer gets a CI run per merge, so the daily run is the only thing standing
  # behind it — and that only pays if a failure is NOTICED. Measured 2026-07-29 (conductor):
  # 13 CI failures in 2026-07, and Actions-failure notifications delivered by any route: ZERO
  # (0 emails in 60 days incl. spam, 0 `ci_activity` in the notification inbox). Issue/PR comment
  # notifications, by contrast, were verified as arriving. So this converts the channel that does
  # not work into the one that does. The hole predates the schedule: it was already 0/13 while
  # `push: main` existed — the daily run did not create it, it just removed the excuse.
  notify-main-red:
    name: Notify main red
    needs: [validate, test, build]
    # ★Known and accepted, not overlooked: GitHub warns "Avoid using `always` for any task that
    # could suffer from a critical failure, for example: getting sources, otherwise the workflow
    # may hang until it times out" — and this job is `always()` + actions/checkout, exactly that
    # shape. Accepted because the alternative the docs suggest, `!cancelled()`, would suppress the
    # case we deliberately report: a cancelled scheduled run is "not success" and must file an
    # issue.
    # ★So the hang is bounded here instead, by timeout-minutes below. An earlier version of this
    # comment said "revisit if a run is ever observed hanging" — that does not work in this repo:
    # the observing is done by whoever notices a stuck Actions run, and Actions failures reached
    # nobody 13 times out of 13. The observation path is the very hole this job exists to cover,
    # so it cannot also be the safety net for the job itself.
    #
    # `always()` so this still runs when the jobs it watches have failed. Not gated on PRs: a PR
    # failure is already visible on the PR, and filing issues for those would bury the signal.
    # `workflow_dispatch` IS included so the whole path can be exercised on demand — without it
    # the only way to find out whether this works is to wait for main to break, which is the
    # situation it exists to cover.
    #
    # Restricted to main on purpose. `workflow_dispatch` can be aimed at ANY ref, and both the
    # issue title and body say "main" unconditionally — so without this a dispatch from a red
    # feature branch would file "CI: main is red" while main was fine. This job watches main;
    # a feature branch being red is already visible on its PR.
    #
    # ★Expectation depends on BOTH event and ref — do not remember this as "skipped is fine":
    #     pull_request                  → skipped   (a `success` means the gate is broken)
    #     schedule (always on main)     → success   (a `skipped` means the notifier never ran, and
    #                                                where Actions failures notify nobody, nothing
    #                                                else would tell you)
    #     workflow_dispatch on main     → success   (this is the on-demand end-to-end test)
    #     workflow_dispatch on any else → skipped   (correct — not a fault)
    # A green run still executes this job and reports success after doing nothing.
    if: >-
      always() && github.ref == 'refs/heads/main'
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Bounds the hang described above. Measured: this job took 9s on run 30434353074, so 5 minutes
    # is ~33x headroom — it can only fire on a genuine stall, not on a slow day. Deliberately NOT
    # added to validate/test/build: none of them use `always()`, so the documented hazard does not
    # apply to them, and they legitimately run for several minutes.
    # (No claim is made here about what the default timeout would otherwise be — that number is
    # widely repeated but was not verified. What is verified is that there was no explicit bound.)
    timeout-minutes: 5
    permissions:
      # ★BOTH are required. A job-level `permissions:` block REPLACES the default token scopes
      # rather than adding to them, so listing only `issues: write` silently drops `contents:
      # read` and actions/checkout fails with "Repository not found" — which is how the first
      # version of this job failed (run 30431382682, 2026-07-29). That failure mode is nasty
      # here specifically: this job only runs when main is already red, so a broken notifier
      # would break exactly when it is needed, and its own failure reaches nobody either.
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Open / update / close the main-red issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./scripts/ci/notify-main-red.sh
