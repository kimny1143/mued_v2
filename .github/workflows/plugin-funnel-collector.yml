name: Plugin Funnel Daily Collector

# Stage A collector (scripts/aggregate-plugin-funnel-daily.ts) を毎日走らせ、出力 JSON を
# orphan branch `data/plugin-funnel-reports` に publish する。insight課 Stage B が sparse-checkout
# でそのパスだけを消費する。
#
# main には一切書かない: publish は専用 worktree の中で orphan branch に対してのみ commit する
# (`/reports/` は .gitignore 済で main には元々 1 件も入っていない)。
#
# ★cron gotcha 回避 (root CLAUDE.md「GitHub Actions cron変更時の job-level if: filter dependency」):
# 本 workflow は cron 文字列を job/step の `if:` で比較する条件を **持たない**。持つと schedule を
# 変えた時に条件が false になり、job が silent skip して失敗として通知されない。repo 全体でも
# 該当 0 件であることを確認済み (検出コマンドは上記 CLAUDE.md 参照。ここに検出対象の文字列そのものを
# 書くと、その grep が本コメントに当たって偽陽性になるため書かない)。今後も導入しないこと。
#
# READ-ONLY な集計: collector は Resend GET + DB SELECT のみで write は無い。出力は件数・率だけで
# PII を含まない (scripts/aggregate-plugin-funnel-daily.ts のヘッダ参照)。

on:
  # schedule を開ける条件は「無人で走り始める前に成功を1度見る」。これは上流が安定したかとは別に、
  # ★**資格情報が変わるたびに**適用される。read-only ロール (DATABASE_URL_READONLY) への切替でも
  # 同じ手順を踏んだ:
  #   run 30149602277 (2026-07-25) = failure  … 最初の secret はパスワード不一致だった
  #   run 30150368722 (2026-07-25) = success  … 再登録後。Stage A collector 成功 /
  #                                             Publish は publish:false ゆえ skipped /
  #                                             muedsp_reachable=383 (7/22 366 → 7/23 374 と連続)
  # ＝ **この cron を開けてよい根拠は上の success 1件**。次に資格情報を触る時は、また一度
  # 手動 dispatch を通してから schedule に戻すこと。
  schedule:
    # 01:30 UTC = 10:30 JST。collector の既定は「昨日 UTC」なのでこの時刻には対象日が確定済み。
    # daily-rag-metrics.yml (17:00 UTC) とは時間帯をずらして同時実行を避ける。
    # ★cron を変える時は、job/step の `if:` が schedule 文字列を比較していないかを先に全列挙する
    # (残っていると条件 false で silent skip する — threads-api #140)。検出コマンドは冒頭コメントと
    # root CLAUDE.md 参照。★ここに検出対象の文字列を書くと grep が自分に当たって偽陽性になる。
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Target UTC date (YYYY-MM-DD). 空なら昨日 UTC。'
        required: false
        type: string
      publish:
        description: 'data/plugin-funnel-reports に push するか (false なら集計してログに出すだけ)'
        required: false
        default: true
        type: boolean
      hoo_usage_snapshot:
        description: 'Hoo AI chat の使用量スナップショットを撮る (scripts/sql/hoo-usage-snapshot.sql・読み取りのみ)'
        required: false
        default: false
        type: boolean

# 既定は read。publish step のために contents: write を明示的に与える。
permissions:
  contents: write

# 同時に走らせない (orphan branch への push が競合するため)。
concurrency:
  group: plugin-funnel-collector
  cancel-in-progress: false

jobs:
  collect-and-publish:
    name: Collect plugin funnel metrics and publish
    # スナップショットだけを撮りに来た dispatch では collector を走らせない (Resend GET と DB を
    # 無駄に叩かないため)。
    #
    # ★cron gotcha を踏まないよう、この条件は schedule 文字列を一切参照しない (冒頭コメント参照)。
    # 参照するのは event 名と input だけ:
    #   schedule                     → 第1項が true  → 走る
    #   dispatch (hoo_usage=false)   → 第2項が true  → 走る
    #   dispatch (hoo_usage=true)    → 両項 false    → skip (スナップショットのみ)
    if: github.event_name != 'workflow_dispatch' || !inputs.hoo_usage_snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          # shallow のままだと orphan branch を fetch して push する時に
          # "shallow update not allowed" で弾かれうるため全履歴を取る。
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Stage A collector
        id: collect
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # read-only ロール (funnel_collector_ro) の資格情報。collector は SELECT 3本しか撃たない
          # (scripts/aggregate-plugin-funnel-daily.ts:199,216,231・全て plugin_entitlements 単一) ので、
          # 無人ジョブに書ける資格情報を渡さない。ロール作成手順は docs/ops/collector-readonly-role.md。
          DATABASE_URL: ${{ secrets.DATABASE_URL_READONLY }}
          # ★ inputs を run: 内へ直接展開しない (script injection 回避)。必ず env 経由で参照する。
          TARGET_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          if [ -n "${TARGET_DATE:-}" ]; then
            echo "target date (input): $TARGET_DATE"
            npx tsx scripts/aggregate-plugin-funnel-daily.ts "$TARGET_DATE" 2>&1 | tee collector.log
          else
            echo "target date: yesterday UTC (collector default)"
            npx tsx scripts/aggregate-plugin-funnel-daily.ts 2>&1 | tee collector.log
          fi
          # 日付は collector が決めるのでこちらで推測せず、collector 自身が出力した行から取る。
          report="$(sed -n 's/^→ written: //p' collector.log | tail -n 1)"
          if [ -z "$report" ] || [ ! -f "$report" ]; then
            echo "::error::collector did not report a written file (looked for '→ written: <path>')"
            exit 1
          fi
          echo "report_path=$report" >> "$GITHUB_OUTPUT"
          echo "report_name=$(basename "$report")" >> "$GITHUB_OUTPUT"
          echo "produced: $report"

      - name: Publish to data/plugin-funnel-reports
        # 集計が失敗したら publish しない (古い/欠けたデータを最新として出さない)。
        if: success() && (github.event_name != 'workflow_dispatch' || inputs.publish)
        env:
          REPORT_PATH: ${{ steps.collect.outputs.report_path }}
          REPORT_NAME: ${{ steps.collect.outputs.report_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # この行の存在理由が「鮮度の正本を機械可読にする」である以上、来歴を固定値にすると
          # ファイル自身が嘘をつく (手動 dispatch の publish が automated と記録される)。
          TRIGGER: ${{ github.event_name }}
        run: |
          set -euo pipefail
          cp "$REPORT_PATH" "$RUNNER_TEMP/$REPORT_NAME"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin data/plugin-funnel-reports
          # 専用 worktree の中でだけ操作する = main の作業ツリーは触らない
          git worktree add "$RUNNER_TEMP/pub" origin/data/plugin-funnel-reports
          cd "$RUNNER_TEMP/pub"
          git switch -c publish-tmp

          mkdir -p reports/plugin-funnel
          cp "$RUNNER_TEMP/$REPORT_NAME" "reports/plugin-funnel/$REPORT_NAME"

          # 鮮度は散文でなく機械可読ファイルを正本にする (README の日付が stale 化する事故を防ぐ)。
          cat > LAST_PUBLISH.json <<JSON
          {
            "last_publish_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "trigger": "$TRIGGER",
            "workflow": "plugin-funnel-collector",
            "workflow_run": "$RUN_URL",
            "report": "reports/plugin-funnel/$REPORT_NAME"
          }
          JSON

          git add -A
          if git diff --cached --quiet; then
            echo "no change to publish (same report content) — skipping commit"
            exit 0
          fi
          git commit -m "data(funnel): $REPORT_NAME 自動 publish (run $GITHUB_RUN_ID)"
          git push origin HEAD:data/plugin-funnel-reports
          echo "published $REPORT_NAME to data/plugin-funnel-reports"

      - name: Report failure
        if: failure()
        run: |
          echo "::error::plugin funnel collector failed — data/plugin-funnel-reports は更新されていません"
          echo "鮮度の正本は data branch の LAST_PUBLISH.json です。最終 publish がこの run より古ければ、この失敗が原因です。"

  # Hoo AI chat の使用量スナップショット (Chief の entitlement brief 用)。
  #
  # 既存 workflow に job を足す形にしたのは、★secret の参照先を増やさないため。新規 workflow を
  # 作ると DATABASE_URL_READONLY を読む場所が 2 つになる。
  #
  # 手動 dispatch でのみ走る (既定 false)。collector の schedule には乗せない: これは「毎日の指標」
  # ではなく「問いが立った時に撮る 1 枚」で、日次で回すとログが増えるだけで誰も読まない。
  # 1k 到達時の再較正でも同じ job を再実行する (使い捨てにしない = そもそも workflow にした理由)。
  #
  # SQL は scripts/sql/hoo-usage-snapshot.sql に固定でコミットしてある。★workflow_dispatch の
  # 入力で SQL を渡せる形にはしない — それは本番へ任意クエリを投げる口になる。
  hoo-usage-snapshot:
    name: Hoo usage snapshot (read-only)
    if: github.event_name == 'workflow_dispatch' && inputs.hoo_usage_snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # collector と違い publish しないので書き込み権限を持たせない。
    permissions:
      contents: read

    steps:
      # ★"main" ではなく、起動した ref を checkout する (`ref` 未指定の既定)。実際この job の
      # 初回検証は PR ブランチから dispatch して回した。
      # → したがって「SQL は必ず main の版が走る」とは言えない。言えるのは
      #   ★**SQL が workflow_dispatch の入力からは渡せない** ことまで (固定ファイルを読む)。
      #   ブランチを push できる人は SQL を変えられるが、その人は merge もできるので脅威は増えない。
      - name: Checkout the triggering ref
        uses: actions/checkout@v4

      - name: Run snapshot
        env:
          # collector と同じ read-only ロール。SELECT しか通らないので、SQL を間違えても
          # 本番を壊せない (これが「当方の資格情報で 1 回叩く」より安全な理由)。
          PGURL: ${{ secrets.DATABASE_URL_READONLY }}
        run: |
          set -euo pipefail

          if [ -z "${PGURL:-}" ]; then
            echo "::error::DATABASE_URL_READONLY is empty — 資格情報が無い状態で 0 件を結果として出さない"
            exit 1
          fi

          # ★空振り検出を先に置く: [0] の control が 0 行なら「使われていない」ではなく
          # 「読めていない」。0 を結果として出さずにここで落とす。
          rows="$(psql "$PGURL" -tAc 'SELECT count(*) FROM public.hoo_conversations;')"
          echo "control: hoo_conversations rows = ${rows}"
          if [ "${rows}" = "0" ]; then
            echo "::error::control returned 0 rows — 「使われていない」と「読めていない」を区別できないため中断する。GRANT と接続先を確認すること。"
            exit 1
          fi

          echo "--- snapshot (aggregate only; no identifiers are selected) ---"
          # ★ON_ERROR_STOP=1 は必須。既定の psql は文がエラーでも続行して exit 0 を返すので、
          # 付けないと「エラーを出力しながら job は緑」になる (= 本日 何度も踏んだ形)。
          psql "$PGURL" -v ON_ERROR_STOP=1 -f scripts/sql/hoo-usage-snapshot.sql

      - name: Interpretation guard
        if: always()
        run: |
          echo "この出力から言えるのは POST /api/hoo/chat のぶんだけ。"
          echo "dial/chat・hoo/poc/chat・lobe/commentary・タイトル生成は ここに記録されないため、"
          echo "cost_usd は hoo/chat の下限値であって Anthropic 総額ではない。"
          echo "max(started_at) が古い/無い場合の読みは 4 つある (未使用 / 書き込み破損 / 呼び手アプリ未更新 / 本番が別アカウント)。"
          echo "退役の判断材料としては、これ単独では足りない。"
