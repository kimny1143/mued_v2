# Deploy Hoo MCP Worker to Cloudflare
#
# Triggers on push to main when workers/hoo-mcp/** files change.
# Prevents the manual-deploy漏れ issue (PR#132 incident).
#
# Required GitHub Secrets:
#   CLOUDFLARE_API_TOKEN  — API token with "Workers Scripts: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account ID (glasswerkskimny)

name: Deploy Hoo MCP

on:
  push:
    branches: [main]
    paths:
      - 'workers/hoo-mcp/**'

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: workers/hoo-mcp/package-lock.json

      - name: Install dependencies
        working-directory: workers/hoo-mcp
        run: npm ci

      - name: Deploy via Wrangler
        working-directory: workers/hoo-mcp
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
