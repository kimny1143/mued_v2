# Deploy Hoo MCP Worker to Cloudflare
#
# ★Manual only. The Worker is retired (kimny 2026-10-22「畳む」; workers.dev disabled 2026-10-28), so a push
#   to workers/hoo-mcp/** no longer deploys it. The code is kept so it can be brought back.
#   It never deployed from CI anyway: all 6 runs (2026-04-20 to 2026-10-24) failed at "Validate required
#   secrets" (the Cloudflare secrets are not set here). Before running it by hand, also track
#   workers/hoo-mcp/package-lock.json, or `npm ci` fails next.
#
# Required GitHub Secrets:
#   CLOUDFLARE_API_TOKEN  — API token with "Workers Scripts: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account ID (glasswerkskimny)

name: Deploy Hoo MCP

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "Error: CLOUDFLARE_API_TOKEN secret is not set"
            exit 1
          fi
          if [ -z "$CF_ACCOUNT" ]; then
            echo "Error: CLOUDFLARE_ACCOUNT_ID secret is not set"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: workers/hoo-mcp/package-lock.json

      - name: Install dependencies
        working-directory: workers/hoo-mcp
        run: npm ci

      - name: Typecheck worker
        working-directory: workers/hoo-mcp
        run: npx tsc --noEmit

      - name: Deploy via Wrangler
        working-directory: workers/hoo-mcp
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Log deploy info
        run: echo "Deployed by ${{ github.event.head_commit.author.name }} @ ${{ github.sha }}"
