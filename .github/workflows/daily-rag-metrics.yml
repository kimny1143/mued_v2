name: Daily RAG Metrics Calculation

# ★Schedule removed (conductor 2026-10-01, CI review stage 0). Measured that day: nothing in app/,
#   components/ or lib/ reads rag_metrics_history (the only reference is the INSERT in
#   app/api/cron/rag-metrics/route.ts), and that Vercel cron (vercel.json) writes the same table
#   every day already — so this workflow was a second writer with no reader (~60 billed min/month).
#   Manual runs stay possible. To bring the schedule back, restore `schedule: - cron: '0 17 * * *'`.
on:
  workflow_dispatch:      # Manual trigger button in GitHub Actions UI
    inputs:
      date:
        description: 'Target date (YYYY-MM-DD) - leave empty for yesterday'
        required: false
        type: string

jobs:
  calculate-rag-metrics:
    name: Calculate and Store RAG Metrics
    runs-on: ubuntu-latest

    # Timeout after 10 minutes
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run RAG metrics calculation
        run: |
          if [ -z "${{ github.event.inputs.date }}" ]; then
            echo "Calculating metrics for yesterday (default)"
            npm run job:rag-metrics
          else
            echo "Calculating metrics for ${{ github.event.inputs.date }}"
            npm run job:rag-metrics ${{ github.event.inputs.date }}
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Report success
        if: success()
        run: |
          echo "✅ RAG metrics calculation completed successfully"
          echo "Timestamp: $(date -u)"

      - name: Report failure
        if: failure()
        run: |
          echo "❌ RAG metrics calculation failed"
          echo "Timestamp: $(date -u)"
          echo "Check logs above for error details"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rag-metrics-logs-${{ github.run_number }}
          path: |
            npm-debug.log*
            yarn-error.log*
          retention-days: 7
          if-no-files-found: ignore
