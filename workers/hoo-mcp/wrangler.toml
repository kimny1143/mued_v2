name = "hoo-mcp"
main = "src/index.ts"
compatibility_date = "2024-12-01"
# ★Retired (kimny 2026-10-22「畳む」). workers.dev was disabled in the Cloudflare dashboard on 2026-10-28;
#   without this line, any `wrangler deploy` would turn the public URL back on (the default is true).
workers_dev = false

[vars]
ALLOWED_ORIGINS = "https://mued.jp,https://www.mued.jp,http://localhost:3000,https://*.vercel.app"
MUED_API_URL = "https://mued.jp"

# Secrets (set via `wrangler secret put`):
# DATABASE_URL — Neon PostgreSQL connection string
# INTERNAL_API_KEY — For Worker → MUED API internal calls
# GA4_MEASUREMENT_ID — GA4 Measurement Protocol measurement ID (optional)
# GA4_API_SECRET — GA4 Measurement Protocol API secret (optional)
